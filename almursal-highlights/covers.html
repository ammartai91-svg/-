.disc{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;

 display:grid;place-items:center}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.35),rgba(255,255,255,0) 45%)}
svg{width:600px;height:600px;position:relative;filter:drop-shadow(0 12px 24px rgba(10,20,90,.35))}
