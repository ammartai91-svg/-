<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>at بالعراقي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================
   الألوان والمتغيرات — عدّلها من هنا
   ===================================================== */
:root{
  --y:#FDD27F;          /* أصفر الهوية */
  --y-deep:#F2B94B;
  --ink:#0e0e0e;
  --mut:#6e6e6e;
  --line:#e9e9e9;
  --soft:#f6f4ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:#fff;color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* ---------- شريط تجريبي ---------- */
.demo{background:#fff4d6;color:#6a4a00;font-size:.82rem;text-align:center;padding:6px 40px;position:relative;font-weight:600}
.demo button{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:1.1rem;opacity:.7}

/* ---------- الشريط العلوي ---------- */
.top{background:var(--ink);color:#d9d9d9;font-size:.82rem}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:36px}
.soc{display:flex;gap:6px}
.soc a{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;transition:.2s;color:#bbb}
.soc a:hover{background:var(--y);color:#000}
.soc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- الهيدر ---------- */
header.hd{background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:26px;height:84px}
.logo{display:block;flex:none}
.logo svg,.logo img{width:68px;height:68px;border-radius:14px}
nav.mn{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.mn::-webkit-scrollbar{display:none}
nav.mn a{padding:8px 14px;font-weight:800;font-size:1.02rem;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
nav.mn a:hover{color:#000;border-color:var(--y)}
nav.mn a.on{border-color:var(--ink)}
.sbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none;transition:.2s}
.sbtn:hover{background:var(--y)}
.sbtn svg{width:19px;height:19px}
.sbox{display:none;background:var(--soft);border-bottom:1px solid var(--line)}
.sbox.open{display:block}
.sbox form{display:flex;gap:10px;padding:14px 0}
.sbox input{flex:1;font:inherit;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
.sbox input:focus{border-color:var(--ink)}
.sbox button.go{background:var(--ink);color:#fff;padding:0 26px;border-radius:8px;font-weight:700}

/* ---------- شريط عاجل ---------- */
.brk{background:var(--ink);color:#fff}
.brk .wrap{display:flex;align-items:center;gap:16px;height:46px;overflow:hidden}
.brk .tag{background:var(--y);color:#000;font-weight:900;padding:2px 14px;border-radius:3px;flex:none;font-size:.92rem}
.brk .txt{font-weight:700;font-size:.97rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.brk .txt a:hover{color:var(--y)}

/* ---------- صور / بدائل الصور ---------- */
.im{background-size:cover;background-position:center;position:relative;overflow:hidden;container-type:inline-size;background-color:#222}
.ph{background-image:linear-gradient(135deg,var(--g1),var(--g2))}
.ph::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.18),transparent 45%)}
.ph span{position:absolute;left:8%;top:50%;transform:translateY(-50%);font:900 44cqw/1 'Cairo',sans-serif;color:#fff;opacity:.11;direction:ltr}

.lab{font-weight:800;font-size:.86rem}
.tm{color:var(--mut);font-size:.8rem}

/* ---------- الهيرو ---------- */
.hero{margin-top:22px}
.slides{position:relative;height:580px;background:#111;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.slide.on{opacity:1;visibility:visible}
.slide .im{position:absolute;inset:0}
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 5%,rgba(0,0,0,.1) 65%)}
.slide .cap{position:absolute;z-index:2;right:34px;left:34px;bottom:178px;color:#fff}
.slide .cap .lab{background:var(--y);color:#000!important;padding:2px 12px;border-radius:3px;display:inline-block;margin-bottom:10px}
.slide .cap h2{font-size:2.5rem;line-height:1.35;font-weight:900;max-width:880px;text-wrap:balance}
.slide .cap p{margin-top:8px;opacity:.85;font-size:1.02rem}
.thumbs{position:absolute;z-index:3;right:16px;left:16px;bottom:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.th{background:rgba(10,10,10,.62);backdrop-filter:blur(8px);color:#fff;text-align:right;padding:12px 14px;border-top:3px solid transparent;transition:.25s}
.th:hover{background:rgba(10,10,10,.8)}
.th.on{border-top-color:var(--y);background:rgba(10,10,10,.85)}
.th .lab{font-size:.78rem;color:var(--y)!important;display:block}
.th b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem;line-height:1.5;margin-top:2px}
.dots{display:none}

/* ---------- عناوين الأقسام ---------- */
.sh{display:flex;align-items:center;justify-content:space-between;margin:54px 0 22px;padding-bottom:12px;border-bottom:2px solid var(--ink);position:relative}
.sh::after{content:'';position:absolute;right:0;bottom:-2px;width:90px;height:4px;background:var(--y)}
.sh h2{font-size:1.75rem;font-weight:900;line-height:1.2}
.sh a{font-weight:700;font-size:.92rem;color:var(--mut)}
.sh a:hover{color:#000}

/* ---------- آخر الأخبار (شبكة) ---------- */
.latest{display:grid;grid-template-columns:repeat(3,1fr);gap:0 34px}
.row{display:flex;gap:16px;padding:22px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.row .im{width:150px;height:150px;flex:none}
.row h3{font-size:1.08rem;font-weight:800;line-height:1.55;margin:2px 0 6px;transition:.2s}
.row:hover h3{color:#000;text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:3px;text-underline-offset:5px}
.more{display:block;margin:34px auto 0;padding:12px 70px;border:1.5px solid var(--ink);border-radius:40px;font-weight:800;transition:.2s}
.more:hover{background:var(--ink);color:var(--y)}

/* ---------- بلوك قسم ---------- */
.blk{display:grid;grid-template-columns:1.25fr 1fr;gap:34px}
.big .im{aspect-ratio:16/10;width:100%}
.big h3{font-size:1.6rem;font-weight:900;line-height:1.45;margin:14px 0 6px}
.big:hover h3{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:3px;text-underline-offset:6px}
.big p{color:#444}
.mini{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.mini:first-child{padding-top:0}
.mini .im{width:110px;height:84px;flex:none}
.mini h4{font-size:1rem;font-weight:800;line-height:1.5}
.mini:hover h4{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;text-underline-offset:4px}

/* ---------- فيديو ---------- */
.vid{background:var(--ink);color:#fff;margin-top:64px;padding:8px 0 56px}
.vid .sh{border-color:#333}
.vid .sh a{color:#aaa}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.vc .im{aspect-ratio:9/12}
.vc .pl{position:absolute;z-index:2;inset:0;display:grid;place-items:center}
.vc .pl i{width:62px;height:62px;border-radius:50%;background:var(--y);display:grid;place-items:center;transition:.25s;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.vc .pl i::after{content:'';border-right:0;border-left:19px solid #000;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-right:-5px;transform:scaleX(-1)}
.vc:hover .pl i{transform:scale(1.12)}
.vc h4{margin-top:12px;font-size:1.02rem;font-weight:800;line-height:1.5}

/* ---------- شريط المتابعة ---------- */
.fol{background:var(--y);padding:44px 0}
.fol .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.fol h3{font-size:1.9rem;font-weight:900;line-height:1.3}
.fol p{font-weight:600;margin-top:4px}
.fol .btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;padding:12px 28px;border-radius:40px;font-weight:800;transition:.2s}
.btn:hover{transform:translateY(-2px);background:#000}
.btn.o{background:transparent;color:#000;border:2px solid #000}
.btn.o:hover{background:#000;color:var(--y)}

/* ---------- الفوتر ---------- */
footer{background:#0a0a0a;color:#b8b8b8;padding:54px 0 0}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}
footer h5{color:#fff;font-size:1.05rem;margin-bottom:14px;font-weight:800}
footer li{list-style:none;margin:7px 0}
footer li a:hover{color:var(--y)}
footer .ab{margin-top:14px;max-width:420px;font-size:.95rem}
.lic{margin-top:14px;display:inline-block;border:1px solid #333;border-radius:6px;padding:6px 12px;font-size:.82rem;color:#d6d6d6}
.copy{border-top:1px solid #222;margin-top:40px;padding:18px 0;font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* ---------- صفحة المقال ---------- */
.art{max-width:820px;margin:34px auto 0}
.art .lab{background:var(--y);color:#000!important;padding:2px 12px;border-radius:3px;display:inline-block}
.art h1{font-size:2.35rem;line-height:1.45;font-weight:900;margin:14px 0 12px;text-wrap:balance}
.meta{display:flex;gap:16px;color:var(--mut);font-size:.9rem;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.art .im.cov{aspect-ratio:16/9;width:100%;margin:22px 0}
.art iframe{width:100%;aspect-ratio:16/9;border:0;margin:22px 0}
.body p{font-size:1.14rem;line-height:2;margin-bottom:18px;color:#222}
.share{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0;align-items:center}
.share b{font-weight:800}
.share a,.share button{padding:8px 18px;border-radius:30px;background:var(--soft);font-weight:700;font-size:.9rem;transition:.2s}
.share a:hover,.share button:hover{background:var(--y)}
.empty{padding:70px 0;text-align:center;color:var(--mut);font-size:1.1rem}
.pg{padding-bottom:20px}
.pgt{margin:36px 0 6px;font-size:2.1rem;font-weight:900}

/* ---------- قسم عاجل ---------- */
:root{--red:#D92D2D}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,45,45,.55)}70%{box-shadow:0 0 0 9px rgba(217,45,45,0)}100%{box-shadow:0 0 0 0 rgba(217,45,45,0)}}
.live{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--red);margin-left:10px;animation:pulse 1.6s infinite;vertical-align:middle}
nav.mn a.nb{background:var(--red);color:#fff;border-radius:4px;border-bottom:0;padding:4px 14px;align-self:center;margin:0 4px;display:flex;align-items:center;gap:8px}
nav.mn a.nb::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
nav.mn a.nb:hover{background:#b92222;color:#fff}
.brk .tag{background:var(--red);color:#fff}
.bk{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:.72rem;padding:0 8px;border-radius:3px;margin-left:6px;vertical-align:middle;line-height:1.7}
.sh.red::after{background:var(--red)}
.bkn{background:#fff7f5;margin-top:34px;padding-bottom:34px;border-bottom:1px solid #f3dcd8}
.bkn .sh{margin-top:0;padding-top:30px;border-bottom-color:var(--red)}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.bc{background:#fff;border-top:4px solid var(--red);padding:16px 18px 18px;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:.2s;display:block}
.bc:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(217,45,45,.15)}
.bc .bt{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:800;font-size:.84rem}
.bc h3{font-size:1.06rem;font-weight:800;line-height:1.6;margin:8px 0 8px}
.bc:hover h3{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:5px}


/* =====================================================
   واجهة v2 — هيرو بتوقيع البطاقة، شريط الأرقام، إعلانات
   ===================================================== */
:root{--wine:#7A1A2E;--navy:#1F2A8C;--green:#0F5A3C}
.hcta{background:var(--y);color:#000;font-weight:900;padding:9px 22px;border-radius:40px;flex:none;font-size:.95rem;transition:.2s}
.hcta:hover{background:var(--ink);color:var(--y)}
.ph::after{content:'';position:absolute;inset:0;opacity:.16;background:radial-gradient(circle at 30% 25%,#fff 0 2px,transparent 3px) 0 0/54px 54px,radial-gradient(circle at 70% 65%,#fff 0 2px,transparent 3px) 27px 27px/54px 54px}
.chip{display:inline-block;font-weight:800;font-size:.78rem;padding:1px 11px;border-radius:4px;line-height:1.8;color:#fff}
.sh{--ac:var(--y)}
.sh::after{background:var(--ac)}

/* الهيرو */
.hx{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:16px;margin-top:20px}
.hstage{position:relative;height:580px;background:#111;overflow:hidden;border-radius:14px}
.hs{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.hs.on{opacity:1;visibility:visible}
.hs .im{position:absolute;inset:0}
.hs::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,transparent 55%)}
.hs .hcap{position:absolute;z-index:2;right:0;bottom:0;width:min(800px,92%);color:#fff}
.hbox{padding:26px 34px 24px;border-radius:0 72px 0 0}
.hbox h2{font-size:2.3rem;line-height:1.38;font-weight:900;text-wrap:balance;margin-top:8px}
.hbox .bk{margin:0 0 0 8px;font-size:.8rem}
.hstrip{background:var(--y);color:#000;display:flex;justify-content:space-between;gap:16px;padding:11px 34px;font-weight:700;font-size:.95rem;border-radius:0 0 0 52px}
.hstrip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstrip b{flex:none;font-weight:900}
.hside{display:flex;flex-direction:column;background:var(--ink);color:#fff;border-radius:14px;overflow:hidden}
.hside .hh{padding:16px 20px;font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2a2a}
.hside .hh .live{margin:0}
.hside button.hit{flex:1;text-align:right;display:flex;gap:14px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid #222;position:relative;transition:.25s;overflow:hidden}
.hside button.hit:last-child{border-bottom:0}
.hside button.hit:hover{background:#171717}
.hside button.hit.on{background:#1b1b1b}
.hit em{font-style:normal;font-weight:900;font-size:1.8rem;line-height:1;color:#555;min-width:30px;transition:.25s}
.hit.on em{color:var(--y)}
.hit small{display:block;font-weight:800;color:var(--y);font-size:.78rem}
.hit b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:.97rem;line-height:1.55;font-weight:700}
.hit i{position:absolute;right:0;bottom:0;height:3px;width:0;background:var(--y)}
.hit.on i{animation:fill 6.5s linear forwards}
@keyframes fill{to{width:100%}}
.hdots{display:none}

/* شريط الأرقام والمقاطع */
.pulse{background:var(--ink);color:#fff;margin-top:34px;position:relative;overflow:hidden}
.pulse::before{content:'';position:absolute;width:620px;height:620px;border-radius:50%;left:-160px;top:-240px;background:radial-gradient(circle,rgba(253,210,127,.2),transparent 65%)}
.pgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding:54px 20px;position:relative}
.eyebrow{display:inline-block;background:rgba(253,210,127,.15);color:var(--y);padding:3px 14px;border-radius:30px;font-weight:700;font-size:.85rem}
.pulse h2{font-size:2.2rem;font-weight:900;line-height:1.4;margin:14px 0 6px;text-wrap:balance}
.cnt{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 28px;margin:26px 0 30px}
.cnt b{display:block;font-size:2.7rem;font-weight:900;color:var(--y);line-height:1.1;direction:ltr;text-align:right}
.cnt small{color:#bdbdbd;font-weight:600;font-size:.92rem}
.btn.y{background:var(--y);color:#000}
.btn.y:hover{background:#fff}
.reels{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.reels::-webkit-scrollbar{display:none}
.reel{flex:0 0 calc(33.333% - 10px);min-width:150px;aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--g1),var(--g2));scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;transition:.25s}
.reel::before{content:'';position:absolute;inset:0;opacity:.16;background:radial-gradient(circle at 30% 25%,#fff 0 2px,transparent 3px) 0 0/54px 54px,radial-gradient(circle at 70% 65%,#fff 0 2px,transparent 3px) 27px 27px/54px 54px}
.reel:hover{transform:translateY(-5px)}
.reel .pb{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;background:var(--y);display:grid;place-items:center}
.reel .pb::after{content:'';border-left:12px solid #000;border-top:7px solid transparent;border-bottom:7px solid transparent;transform:scaleX(-1);margin-right:-3px}
.reel .vw{position:relative;font-size:2.6rem;font-weight:900;line-height:1;direction:ltr;text-align:right}
.reel .vl{position:relative;color:var(--y);font-weight:800;font-size:.85rem;margin:2px 0 8px}
.reel h4{position:relative;font-size:.95rem;line-height:1.55;font-weight:700;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.reel.cta{background:var(--y);color:#000;justify-content:center;align-items:flex-start;gap:8px}
.reel.cta::before{display:none}
.reel.cta b{font-size:2.3rem;font-weight:900;line-height:1.1;direction:ltr}
.reel.cta span{font-weight:800;line-height:1.5}

/* إعلانات */
.adbox{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;height:96px;margin-top:26px;border:1.5px dashed #cfc7b2;border-radius:10px;color:#6b6350;text-align:center;background:repeating-linear-gradient(45deg,#faf8f2,#faf8f2 10px,#f6f2e6 10px,#f6f2e6 20px);transition:.2s}
.adbox:hover{border-color:var(--ink);color:#000}
.adtag{font-size:.72rem;border:1px solid currentColor;padding:0 8px;border-radius:3px}
.adbox b{font-weight:800}
.adbox small{font-weight:600;opacity:.8}
.adbox.sq{height:300px;flex-direction:column;margin-top:28px}

/* آخر الأخبار + الأكثر قراءة */
.lgrid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:44px}
.ncs{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 24px}
.nc{display:block}
.nc-i{position:relative;overflow:hidden;border-radius:10px}
.nc-i .im{aspect-ratio:16/10;width:100%;transition:transform .5s}
.nc:hover .nc-i .im{transform:scale(1.05)}
.nc-i .chip{position:absolute;right:10px;bottom:10px;z-index:2}
.nc-i .bk{position:absolute;left:10px;top:10px;z-index:2;margin:0;font-size:.78rem;padding:0 10px}
.nc h3{font-size:1.12rem;font-weight:800;line-height:1.6;margin:12px 0 2px}
.nc:hover h3{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:3px;text-underline-offset:5px}
.tp{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.tp i{font-style:normal;font-weight:900;font-size:2.1rem;line-height:1;color:var(--y-deep);min-width:34px}
.tp h4{font-size:1rem;font-weight:800;line-height:1.6}
.tp:hover h4{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;text-underline-offset:4px}

/* بلوكات الأقسام */
.bigo{position:relative;display:block;border-radius:12px;overflow:hidden}
.bigo .im{aspect-ratio:16/11;width:100%;transition:transform .5s}
.bigo:hover .im{transform:scale(1.04)}
.bigo .ov{position:absolute;inset:auto 0 0 0;padding:70px 24px 22px;background:linear-gradient(to top,rgba(0,0,0,.88),transparent);color:#fff}
.bigo h3{font-size:1.6rem;font-weight:900;line-height:1.45;margin-top:8px}
.bigo p{opacity:.85;margin-top:4px}

function im(a, cls=''){
  const c = CATS[a.cat] || CATS.general;
  if (a.img) return `<div class="im ${cls}" style="background-image:url('${a.img}')"></div>`;
  return `<div class="im ph ${cls}" style="--g1:${c.g[0]};--g2:${c.g[1]}"><span>at.</span></div>`;
}
const lab = a => `<span class="lab" style="color:${CATS[a.cat].c}">${CATS[a.cat].n}</span>`;

const bk = a => a.breaking ? '<span class="bk">عاجل</span>' : '';
const rowCard = a => `<a class="row" href="${href(a)}">${im(a)}<div>${bk(a)}${lab(a)}<h3>${a.t}</h3><span class="tm">${a.time||''}</span></div></a>`;
const bigCard = a => `<a class="big" href="${href(a)}" style="display:block">${im(a)}<div>${bk(a)}${lab(a)}</div><h3>${a.t}</h3><p>${a.sum||''}</p><span class="tm">${a.time||''}</span></a>`;
const miniCard = a => `<a class="mini" href="${href(a)}">${im(a)}<div>${bk(a)}${lab(a)}<h4>${a.t}</h4><span class="tm">${a.time||''}</span></div></a>`;
const vidCard = a => `<a class="vc" href="${href(a)}" style="display:block"><div style="position:relative">${im(a)}<div class="pl"><i></i></div></div><h4>${a.t}</h4><span class="tm" style="color:#999">${a.time||''}</span></a>`;
const sectionHead = (title, link, col) => `<div class="sh"${col?` style="--ac:${col}"`:''}><h2>${title}</h2><a href="${link}">عرض الكل ←</a></div>`;
const chip = a => { const c = CATS[a.cat]; return `<span class="chip" style="background:${c.c};color:${c.t||'#fff'}">${c.n}</span>`; };
const nCard = a => `<a class="nc" href="${href(a)}"><div class="nc-i">${im(a)}${a.breaking?'<span class="bk">عاجل</span>':''}${chip(a)}</div><h3>${a.t}</h3><span class="tm">${a.time||''}</span></a>`;
const bigO = a => `<a class="bigo" href="${href(a)}">${im(a)}<div class="ov">${bk(a)}${chip(a)}<h3>${a.t}</h3><p>${a.sum||''}</p></div></a>`;
const adSlot = (cls, label) => SITE.showAds ? `<a class="adbox ${cls}" href="mailto:${SITE.email}?subject=${encodeURIComponent('إعلان في '+SITE.name)}"><span class="adtag">إعلان</span><b>${label}</b><small>أعلن معنا — احجز مساحتك</small></a>` : '';
const reelTile = r => `<a class="reel" href="${r.url||SITE.instagram}" target="_blank" rel="noopener" style="--g1:${r.g[0]};--g2:${r.g[1]}"><span class="pb"></span><div class="vw">${r.views}</div><div class="vl">مشاهدة</div><h4>${r.t}</h4></a>`;
const fmt = (v,d) => v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function countUp(el){
  const v = +el.dataset.v, d = +el.dataset.d, sfx = el.dataset.s, t0 = performance.now(), D = 1400;
  const step = t => { const k = Math.min(1,(t-t0)/D), e = 1-Math.pow(1-k,3); el.textContent = fmt(v*e,d) + sfx; if (k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function home(){
  const heroes = ARTICLES.filter(a => a.hero).slice(0,4);
  const slides = heroes.map((a,i)=>{ const c = CATS[a.cat];
    return `<a class="hs ${i?'':'on'}" href="${href(a)}" data-i="${i}">${im(a)}<div class="hcap"><div class="hbox" style="background:${c.c}">${bk(a)}<span class="chip" style="background:#fff;color:#000">${c.n}</span><h2>${a.t}</h2></div><div class="hstrip"><span>${a.sum||''}</span><b>${a.time||''}</b></div></div></a>`; }).join('');
  const side = heroes.map((a,i)=>`<button class="hit ${i?'':'on'}" data-i="${i}"><em>${i+1}</em><div><small>${CATS[a.cat].n}</small><b>${a.t}</b></div><i></i></button>`).join('');
  const dots = heroes.map((a,i)=>`<button class="${i?'':'on'}" data-i="${i}" aria-label="شريحة ${i+1}"></button>`).join('');

  const all = news();
  const cats = ['politics','art','economy','sports','general'];
  const blocks = cats.map(k=>{
    const it = all.filter(a=>a.cat===k);
    if (it.length < 2) return '';
    return `<div class="wrap">${sectionHead(CATS[k].n,'#/c/'+k,CATS[k].c)}<div class="blk">${bigO(it[0])}<div>${it.slice(1,4).map(miniCard).join('')}</div></div></div>`;
  }).join('');
  const vids = ARTICLES.filter(a=>a.cat==='video').slice(0,4);

  const bkItems = ARTICLES.filter(a=>a.breaking).slice(0,4);
  const bkBlock = bkItems.length ? `<section class="bkn"><div class="wrap"><div class="sh red"><h2><i class="live"></i>عاجل</h2><a href="#/c/breaking">عرض الكل ←</a></div><div class="bgrid">${bkItems.map(a=>`<a class="bc" href="${href(a)}"><div class="bt"><span>${a.time||''}</span><span style="color:${CATS[a.cat].c}">· ${CATS[a.cat].n}</span></div><h3>${a.t}</h3></a>`).join('')}</div></div></section>` : '';

  const hot = HOT_IDS.map(byId).filter(Boolean);
  const top5 = (hot.length ? hot : all.slice(0,5)).map((a,i)=>`<a class="tp" href="${href(a)}"><i>${i+1}</i><div>${lab(a)}<h4>${a.t}</h4></div></a>`).join('');
  const stats = (SITE.stats||[]).map(x=>`<div><b data-v="${x.v}" data-d="${x.d}" data-s="${x.s}">${fmt(x.v,x.d)}${x.s}</b><small>${x.l}</small></div>`).join('');
  const pulse = `<section class="pulse"><div class="wrap pgrid"><div><span class="eyebrow">at بالعراقي على إنستغرام</span><h2>ملايين المشاهدات.. وكل يوم قصة جديدة</h2><div class="cnt">${stats}</div><a class="btn y" href="${SITE.instagram}" target="_blank" rel="noopener">تابعنا الآن</a></div><div class="reels">${REELS.map(reelTile).join('')}<a class="reel cta" href="${SITE.instagram}" target="_blank" rel="noopener"><b>${fmt(((SITE.stats||[]).find(x=>x.l==='منشور')||{v:1000}).v,0)}</b><span>منشور وفيديو.. شاهد كل جديد على حسابنا</span></a></div></div></section>`;

  app.innerHTML = `
  <div class="wrap hx"><div class="hstage">${slides}<div class="hdots">${dots}</div></div><div class="hside"><div class="hh"><i class="live"></i>الآن في at بالعراقي</div>${side}</div></div>
  ${SITE.showAds?`<div class="wrap">${adSlot('','مساحة إعلانية 970×90')}</div>`:''}
  ${bkBlock}
  <div class="wrap"><div class="lgrid"><div>${sectionHead('آخر الأخبار','#/c/all')}<div class="ncs" id="lt"></div><button class="more" id="more">المزيد +</button></div><aside>${sectionHead('الأكثر قراءة','#/c/all')}<div>${top5}</div>${adSlot('sq','مساحة إعلانية 300×300')}</aside></div></div>
  ${pulse}
  ${blocks}
  ${vids.length?`<section class="vid"><div class="wrap">${sectionHead('فيديو','#/c/video')}<div class="vgrid">${vids.map(vidCard).join('')}</div></div></section>`:''}
  ${servicesBlock()}`;

  /* آخر الأخبار + زر المزيد */
  let shown = 8; const lt = $('#lt'), more = $('#more');
  const paint = () => { lt.innerHTML = all.slice(0,shown).map(nCard).join(''); more.style.display = shown >= all.length ? 'none' : 'block'; };
  more.onclick = () => { shown += 6; paint(); }; paint();

  /* السلايدر */
  let cur = 0;
  const go = i => {
    cur = (i + heroes.length) % heroes.length;
    document.querySelectorAll('.hs').forEach((e,k)=>e.classList.toggle('on',k===cur));
    document.querySelectorAll('.hit').forEach((e,k)=>e.classList.toggle('on',k===cur));
    document.querySelectorAll('.hdots button').forEach((e,k)=>e.classList.toggle('on',k===cur));
  };
  document.querySelectorAll('.hit,.hdots button').forEach(b=>b.onclick=e=>{e.preventDefault();go(+b.dataset.i);});
  timers.push(setInterval(()=>go(cur+1), 6500));

  /* عدّاد الأرقام عند الظهور */
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ countUp(en.target); io.unobserve(en.target);} }), {threshold:.4});
    document.querySelectorAll('.cnt b').forEach(b=>io.observe(b));
  }
}

/* ---------- صفحة قسم / بحث ---------- */
function listPage(title, items, sub){
  app.innerHTML = `<div class="wrap pg"><h1 class="pgt">${title}</h1>${sub?`<p class="tm">${sub}</p>`:''}
  ${items.length ? (items[0].cat==='video' && items.every(a=>a.cat==='video')
     ? `<div class="vgrid" style="margin-top:24px">${items.map(vidCard).join('').replace(/color:#999/g,'color:#777')}</div>`
     : `<div class="latest" style="margin-top:10px">${items.map(rowCard).join('')}</div>`)
   : `<div class="empty">ما كو نتائج حالياً.</div>`}</div>`;
}

/* ---------- صفحة الخبر ---------- */
function articlePage(a){
  if (!a) return listPage('الخبر غير موجود', []);
  const paras = (a.body || BODY_DEFAULT).split(/\n\n+/).map(p=>`<p>${p}</p>`).join('');
  const rel = ARTICLES.filter(x=>x.cat===a.cat && x.id!==a.id).slice(0,3);
  const url = encodeURIComponent(location.href), tx = encodeURIComponent(a.t);
  app.innerHTML = `<article class="wrap"><div class="art">
    ${a.breaking?'<span class="bk" style="font-size:.85rem;padding:2px 12px">عاجل</span>':''}${lab(a)}
    <h1>${a.t}</h1>
    <div class="meta"><span>${a.author||SITE.name}</span><span>${a.time||''}</span></div>
    ${a.video ? `<iframe src="${a.video}" allowfullscreen></iframe>` : im(a,'cov')}
    ${a.sum?`<p class="body" style="font-weight:800;font-size:1.2rem;line-height:1.9;margin-bottom:16px"><span>${a.sum}</span></p>`:''}
    <div class="body">${paras}</div>
    <div class="share"><b>شارك:</b>
      <a target="_blank" rel="noopener" href="https://wa.me/?text=${tx}%20${url}">واتساب</a>
      <a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${url}">فيسبوك</a>
      <a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${tx}&url=${url}">X</a>
      <button id="cpl">نسخ الرابط</button></div>
  </div>
  ${rel.length?`<div style="max-width:820px;margin:0 auto 40px">${sectionHead('اقرأ أيضاً','#/c/'+a.cat)}${rel.map(miniCard).join('')}</div>`:''}</article>`;
  $('#cpl').onclick = e => { navigator.clipboard && navigator.clipboard.writeText(location.href); e.target.textContent = 'تم النسخ ✓'; };
  document.title = a.t + ' | ' + SITE.name;
}

/* ---------- الراوتر ---------- */
function route(){
  clearTimers();
  const h = window.__h || location.hash || '#/';
  const [, type, arg] = h.split('/');
  document.title = SITE.name + ' | فن ورياضة وأخبار واقتصاد وسياسة';
  if (type === 'a') articlePage(byId(arg));
  else if (type === 'services') { app.innerHTML = servicesBlock().replace('<section class="svc">','<section class="svc" style="margin-top:0">'); document.title = 'خدماتنا | ' + SITE.name; }
  else if (type === 'about') { app.innerHTML = aboutPage(); document.title = 'من نحن | ' + SITE.name; }
  else if (type === 'c') {
    if (arg === 'all') listPage('آخر الأخبار', news());
    else if (arg === 'breaking') listPage('عاجل', ARTICLES.filter(a=>a.breaking), 'آخر الأخبار العاجلة أولاً بأول');
    else if (CATS[arg]) listPage(CATS[arg].n, ARTICLES.filter(a=>a.cat===arg));
    else listPage('غير موجود', []);
  }
  else if (type === 's') { const q = decodeURIComponent(arg||'').trim(); listPage('نتائج البحث', q ? ARTICLES.filter(a=>(a.t+' '+(a.sum||'')).includes(q)) : [], q ? `عن: «${q}»` : ''); }
  else home();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.getAttribute('href') === (type==='c' ? '#/c/'+arg : (type==='services' ? '#/services' : (type==='about' ? '#/about' : (type?'':'#/'))))));
  window.scrollTo(0,0);
}

/* ---------- تهيئة الهيكل الثابت ---------- */
function init(){
  if (!SITE.showDemoBanner) $('#demo').remove();
  $('#date').textContent = new Date().toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const soc = [['ig',SITE.instagram],['fb',SITE.facebook],['x',SITE.x],['yt',SITE.youtube],['tt',SITE.tiktok]].filter(s=>s[1]);
  $('#soc').innerHTML = soc.map(([k,u])=>`<a href="${u}" target="_blank" rel="noopener" aria-label="${k}">${ICON[k]}</a>`).join('');
  $('#logo').innerHTML = logoSVG();
  $('#hcta').href = SITE.instagram;
  $('#flogo').innerHTML = `<div class="logo" style="display:inline-block">${logoSVG()}</div>`;
  $('#nav').innerHTML = NAV.map(([h,t])=>`<a href="${h}"${h==='#/c/breaking'?' class="nb"':((h==='#/c/all'||h==='#/about')?' class="xm"':'')}>${t}</a>`).join('');
  $('#about').textContent = SITE.about;
  $('#lic').textContent = '✔ ' + SITE.license;
  $('#fcats').innerHTML = NAV.slice(1).map(([h,t])=>`<li><a href="${h}">${t}</a></li>`).join('');
  $('#fcon').innerHTML = [SITE.email&&`<li>${SITE.email}</li>`, SITE.phone&&`<li>${SITE.phone}</li>`, SITE.instagram&&`<li><a href="${SITE.instagram}" target="_blank" rel="noopener">إنستغرام</a></li>`, SITE.facebook&&SITE.facebook!=='#'&&`<li><a href="${SITE.facebook}" target="_blank" rel="noopener">فيسبوك</a></li>`].filter(Boolean).join('');
  $('#cp').textContent = '© ' + new Date().getFullYear() + ' ' + SITE.name + ' — جميع الحقوق محفوظة';
  $('#folbtns').innerHTML = `<a class="btn" href="${SITE.instagram}" target="_blank" rel="noopener">إنستغرام</a>` + (SITE.facebook && SITE.facebook!=='#' ? `<a class="btn o" href="${SITE.facebook}" target="_blank" rel="noopener">فيسبوك</a>` : '');

  /* شريط عاجل */
  const br = ARTICLES.filter(a=>a.breaking);
  if (br.length){
    $('#brk').hidden = false; let i = 0; const t = $('#brkt');
    const show = () => { t.style.opacity = 0; setTimeout(()=>{ t.innerHTML = `<a href="${href(br[i])}">${br[i].t}</a>`; t.style.opacity = 1; i = (i+1)%br.length; }, 350); };
    show(); setInterval(show, 5000);
  }

  /* بحث */
  $('#sbtn').onclick = () => { $('#sbox').classList.toggle('open'); $('#sq').focus(); };
  $('#sform').onsubmit = e => { e.preventDefault(); const q = $('#sq').value.trim(); if (q){ window.__h = '#/s/' + encodeURIComponent(q); window.dispatchEvent(new Event('hashchange')); $('#sbox').classList.remove('open'); } };

  window.addEventListener('hashchange', route);
  route();
}
init();
</script>
